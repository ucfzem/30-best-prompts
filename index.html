    <style>
        :root{--fh:'Playfair Display','Cormorant Garamond',Georgia,serif;--fb:'Outfit',system-ui,sans-serif;--fa:'Cairo','Tahoma',sans-serif}
        [data-theme="light"]{--bg:#fdfaf5;--bg2:#f7f1e6;--card:#fff;--tx:#3d3226;--tx2:#6b5d4f;--tx3:#9b8c7a;--gd:#b8942e;--gl:#d4b84a;--gdd:#8a6918;--br:#7a5c3e;--bd:#e5d9c4;--sh:0 2px 16px rgba(74,53,32,.06);--tg:#f5eddb;--tgt:#8a6918;--hi:rgba(184,148,46,.1);--mb:#fff;--mbb:#e5d9c4;--exb:#faf7f0;--exbb:#e5d9c4;--ext:#4a3520}
        [data-theme="dark"]{--bg:#1a1510;--bg2:#231e16;--card:#2a241b;--tx:#f5f0e6;--tx2:#c4b89e;--tx3:#8a7e6b;--gd:#d4b84a;--gl:#e8d07a;--gdd:#a07828;--br:#b8976e;--bd:#3a3228;--sh:0 2px 16px rgba(0,0,0,.4);--tg:#3a2e1e;--tgt:#d4b96a;--hi:rgba(212,184,74,.12);--mb:#2a241b;--mbb:#3a3228;--exb:#1e1914;--exbb:#3a3228;--ext:#e0c872}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--fb);background:var(--bg);color:var(--tx);line-height:1.7;transition:all .3s}
        body.modal-open{overflow:hidden}
        [dir="rtl"] body{font-family:var(--fa)}[dir="rtl"] .prompt-card{border-left:none;border-right:3px solid transparent;padding:22px 48px 22px 22px}[dir="rtl"] .prompt-card:hover{border-right-color:var(--gd)}[dir="rtl"] .prompt-num{right:auto;left:16px}[dir="rtl"] .btn-copy{right:auto;left:16px}[dir="rtl"] .modal-close{right:auto;left:16px}
        header{position:sticky;top:0;z-index:100;background:rgba(253,250,245,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
        [data-theme="dark"] header{background:rgba(26,21,16,.9)}
        .logo{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none}
        .logo-text{font-family:var(--fh);font-size:.95rem;font-weight:700;background:linear-gradient(135deg,var(--gd),var(--gl),var(--gdd));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header-ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
        .lang-btn{background:0;border:1px solid var(--bd);color:var(--tx3);padding:6px 8px;border-radius:6px;font-size:.7rem;cursor:pointer;transition:.3s;display:flex;align-items:center;gap:4px}
        .lang-btn:hover{border-color:var(--gd);color:var(--gd)}.lang-btn.active{background:var(--gd);color:#fff;border-color:var(--gd)}
        .theme-btn{background:0;border:1px solid var(--bd);color:var(--tx3);width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
        .theme-btn:hover{border-color:var(--gd);color:var(--gd)}
        .page-nav{text-align:center;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
        .page-nav button{background:0;border:1px solid var(--gd);color:var(--gd);padding:6px 14px;border-radius:20px;font-size:.75rem;text-decoration:none;cursor:pointer;font-family:var(--fb);transition:.3s}
        .page-nav button:hover{background:var(--gd);color:#fff}
        .page-nav button.active{background:var(--gd);color:#fff;font-weight:600}
        .hero{text-align:center;padding:56px 24px 36px;background:var(--bg2)}
        .hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--tg);color:var(--tgt);padding:8px 20px;border-radius:100px;font-size:.75rem;font-weight:600;margin-bottom:18px;letter-spacing:1px;text-transform:uppercase}
        .hero h1{font-family:var(--fh);font-size:2.2rem;color:var(--tx);margin-bottom:10px}
        .hero h1 span{background:linear-gradient(135deg,var(--gd),var(--gl),var(--gdd));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .hero .sub{font-family:var(--fh);font-style:italic;color:var(--tx3);font-size:1rem;margin-bottom:24px}
        .hero-stats{display:flex;justify-content:center;gap:36px}
        .stat-num{font-family:var(--fh);font-size:1.8rem;font-weight:700;color:var(--gd)}
        .stat-label{font-size:.65rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1px}
        .search-wrap{max-width:480px;margin:20px auto 28px}
        .search-wrap input{width:100%;padding:13px 20px;background:var(--card);border:2px solid var(--bd);border-radius:100px;color:var(--tx);font-size:.9rem;outline:0;transition:.3s}
        .search-wrap input:focus{border-color:var(--gd)}
        main{max-width:800px;margin:0 auto;padding:0 20px 40px}
        .cat-section{margin-bottom:32px}
        .cat-title{font-family:var(--fh);font-size:1.3rem;color:var(--gdd);margin-bottom:4px}
        .cat-range{font-size:.6rem;color:var(--tx3);background:var(--tg);padding:3px 10px;border-radius:100px;display:inline-block;margin-bottom:12px}
        .prompt-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px 48px 22px 22px;margin-bottom:10px;cursor:pointer;transition:.3s;border-left:3px solid transparent;position:relative}
        .prompt-card:hover{border-color:var(--gd);border-left-color:var(--gd);transform:translateY(-2px);box-shadow:var(--sh)}
        .prompt-num{position:absolute;top:16px;right:14px;font-size:.6rem;color:var(--gdd);background:var(--tg);padding:3px 9px;border-radius:100px;font-weight:700}
        .prompt-title{font-family:var(--fh);font-size:.95rem;font-weight:600;color:var(--br);margin-bottom:6px;padding-right:44px}
        .prompt-txt{color:var(--tx2);font-size:.82rem;line-height:1.65;margin-bottom:10px}
        .prompt-txt .var{color:var(--gdd);font-weight:600;background:var(--hi);padding:1px 5px;border-radius:3px;font-size:.82em}
        .btn-copy{position:absolute;top:16px;inset-inline-end:16px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx2);padding:5px 12px;border-radius:7px;font-size:.72rem;cursor:pointer;transition:.3s;font-family:var(--fb)}
        .btn-copy:hover{background:var(--gd);color:#fff;border-color:var(--gd)}
        .btn-detail{background:0;border:1px solid var(--gd);color:var(--gd);padding:5px 12px;border-radius:7px;font-size:.72rem;cursor:pointer;transition:.3s;font-family:var(--fb)}
        .btn-detail:hover{background:var(--gd);color:#fff;border-color:var(--gd)}
        .prompt-actions{display:flex;gap:6px;margin-top:6px}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:.3s}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal{background:var(--mb);border:1px solid var(--mbb);border-radius:16px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;padding:28px 22px;position:relative}
        .modal-close{position:absolute;top:10px;right:14px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx3);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;z-index:5}
        .modal-close:hover{background:var(--gd);color:#fff}
        .modal h3{font-family:var(--fh);font-size:1.1rem;color:var(--br);margin-bottom:14px;padding-right:30px}
        .modal h4{font-family:var(--fh);font-size:.9rem;color:var(--gdd);margin-bottom:6px}
        .modal .example-box{background:var(--exb);border:1px solid var(--exbb);border-radius:10px;padding:14px;font-family:'SF Mono','Consolas',monospace;font-size:.78rem;color:var(--ext);white-space:pre-wrap;margin-bottom:14px;line-height:1.5}
        .modal .explanation{color:var(--tx2);font-size:.82rem;line-height:1.65}
        .modal .explanation strong{color:var(--gdd)}
        footer{text-align:center;padding:24px;border-top:1px solid var(--bd);color:var(--tx3);font-size:.7rem}
        .empty{text-align:center;padding:40px;color:var(--tx3)}
        @media(max-width:600px){header{padding:0 14px;height:56px}.logo-text{font-size:.8rem}.lang-btn{padding:4px 5px;font-size:.6rem}.hero{padding:40px 14px 28px}.hero h1{font-size:1.5rem}.hero-stats{gap:20px}.stat-num{font-size:1.4rem}.prompt-card{padding:16px 50px 16px 14px}.prompt-title{font-size:.85rem;padding-right:36px}.modal{padding:22px 16px}}
    </style>

{n:1,tf:"Générer une API REST avec Node.js et Express",pf:"Crée une API REST avec Node.js et Express pour gérer des [entité]. Inclus les routes CRUD, la validation avec Joi, et une connexion MongoDB. Utilise une architecture MVC. Ajoute un middleware d'erreur générique.",ef:"import express from 'express';\nimport { create, getAll, update, remove } from './controller.js';\nimport { validate } from './validation.js';\nconst router = express.Router();\nrouter.post('/', validate, create);\nrouter.get('/', getAll);\nrouter.put('/:id', validate, update);\nrouter.delete('/:id', remove);\nexport default router;",xf:"Ce prompt guide l'IA pour générer une <strong>API complète et professionnelle</strong> avec séparation MVC, validation Joi et middleware d'erreur centralisé. Idéal pour un MVP backend.",te:"Generate a REST API with Node.js and Express",pe:"Create a REST API with Node.js and Express to manage [entity]. Include CRUD routes, Joi validation, MongoDB. MVC architecture.",ee:"import express from 'express';\nimport { create, getAll, update, remove } from './controller.js';\nconst router = express.Router();\nrouter.post('/', validate, create);\nrouter.get('/', getAll);\nexport default router;",xe:"Guides the AI to generate a <strong>complete professional API</strong> with MVC, Joi validation and error middleware.",tsp:"Generar una API REST con Node.js y Express",psp:"Crea una API REST con Node.js y Express para gestionar [entidad]. Incluye rutas CRUD, validación Joi, MongoDB.",esp:"import express from 'express';\nimport { create, getAll } from './controller.js';\nconst router = express.Router();\nrouter.post('/', validate, create);\nexport default router;",xsp:"Guía a la IA para generar una <strong>API profesional completa</strong> con MVC y validación Joi.",ta:"إنشاء واجهة برمجة REST",pa:"أنشئ واجهة برمجة REST باستخدام Node.js و Express لإدارة [كيان]. مسارات CRUD، تحقق Joi، MongoDB.",ea:"import express from 'express';\nimport { create, getAll } from './controller.js';\nconst router = express.Router();\nrouter.post('/', validate, create);\nexport default router;",xa:"يوجه الذكاء الاصطناعي لإنشاء <strong>API احترافية كاملة</strong> مع MVC والتحقق Joi."},
{n:2,tf:"MVP tableau de bord Next.js + Prisma",pf:"Génère le code d'un tableau de bord Next.js 14 (App Router), Prisma [PostgreSQL], NextAuth. Pages : login, dashboard, profil. Tailwind CSS.",ef:"// app/dashboard/page.tsx\nimport { auth } from '@/auth';\nimport { prisma } from '@/lib/prisma';\nimport { redirect } from 'next/navigation';\nexport default async function Dashboard() {\n  const s = await auth();\n  if (!s) redirect('/login');\n  const u = await prisma.user.findUnique({where:{email:s.user.email}});\n  return <div>Bienvenue {u.name}</div>;\n}",xf:"<strong>Squelette complet d'app Next.js</strong> avec auth intégrée. L'IA configure App Router, Prisma et NextAuth automatiquement.",te:"Dashboard MVP Next.js + Prisma",pe:"Generate Next.js 14 dashboard with App Router, Prisma, NextAuth. Pages: login, dashboard, profile.",ee:"export default async function Dashboard(){const s=await auth();if(!s)redirect('/login');const u=await prisma.user.findUnique({where:{email:s.user.email}});return<div>Welcome {u.name}</div>;}",xe:"<strong>Complete Next.js app skeleton</strong> with built-in auth. AI configures App Router, Prisma and NextAuth.",tsp:"MVP panel Next.js + Prisma",psp:"Genera panel Next.js 14 con App Router, Prisma, NextAuth. Páginas: login, dashboard, perfil.",esp:"export default async function Dashboard(){const s=await auth();if(!s)redirect('/login');const u=await prisma.user.findUnique({where:{email:s.user.email}});return<div>Bienvenido {u.name}</div>;}",xsp:"<strong>Esqueleto completo de app Next.js</strong> con autenticación integrada.",ta:"لوحة تحكم Next.js + Prisma",pa:"أنشئ لوحة تحكم Next.js 14 مع Prisma و NextAuth. صفحات: تسجيل الدخول، لوحة التحكم.",ea:"export default async function Dashboard(){const s=await auth();if(!s)redirect('/login');const u=await prisma.user.findUnique({where:{email:s.user.email}});return<div>مرحباً {u.name}</div>;}",xa:"<strong>هيكل كامل لتطبيق Next.js</strong> مع مصادقة مدمجة."},
{n:3,tf:"Microservice notification RabbitMQ",pf:"Crée un microservice Node.js consommateur RabbitMQ [nom-queue] qui envoie des emails via [SendGrid]. Gestion dead-letters.",ef:"const amqp=require('amqplib');const sg=require('@sendgrid/mail');\nasync function start(){\n  const c=await amqp.connect(process.env.RABBIT_URL);\n  const ch=await c.createChannel();\n  await ch.assertQueue('notifs',{deadLetterExchange:'dlx'});\n  ch.consume('notifs',async(m)=>{\n    const{to,sub,body}=JSON.parse(m.content);\n    await sg.send({to,from:'n@demo.com',subject:sub,html:body});\n    ch.ack(m);\n  });\n}",xf:"<strong>Microservice asynchrone</strong> prêt production avec files d'attente mortes. Découple l'envoi d'emails.",te:"Notification microservice RabbitMQ",pe:"Node.js microservice consuming RabbitMQ queue, sends emails via SendGrid. Dead-letter handling.",ee:"const c=await amqp.connect(url);const ch=await c.createChannel();ch.consume('notifs',async(m)=>{const{to,sub,body}=JSON.parse(m.content);await sg.send({to,from:'n@demo.com',subject:sub,html:body});ch.ack(m);});",xe:"<strong>Production-ready async microservice</strong> with dead-letter queues.",tsp:"Microservicio notificaciones RabbitMQ",psp:"Microservicio Node.js consumidor RabbitMQ, envía correos SendGrid. Dead-letters.",esp:"const c=await amqp.connect(url);const ch=await c.createChannel();ch.consume('notifs',async(m)=>{const{to,sub,body}=JSON.parse(m.content);await sg.send({to,subject:sub,html:body});ch.ack(m);});",xsp:"<strong>Microservicio asíncrono</strong> listo para producción.",ta:"خدمة إشعارات RabbitMQ",pa:"خدمة Node.js مصغرة تستهلك RabbitMQ وترسل بريداً. معالجة الرسائل الميتة.",ea:"const c=await amqp.connect(url);const ch=await c.createChannel();ch.consume('notifs',async(m)=>{const{to,sub,body}=JSON.parse(m.content);await sg.send({to,subject:sub,html:body});ch.ack(m);});",xa:"<strong>خدمة غير متزامنة</strong> جاهزة للإنتاج."},
{n:4,tf:"Chat temps réel Socket.io",pf:"Code serveur Node.js et client HTML/JS pour chat temps réel Socket.io. Gère pseudo, messages, liste connectés. Style Bootstrap.",ef:"const io=new Server(srv);const users=new Map();\nio.on('connection',s=>{\n  s.on('join',n=>{users.set(s.id,n);io.emit('users',[...users.values()]);io.emit('msg',{user:'Sys',text:n+' a rejoint'});});\n  s.on('chat',m=>{io.emit('msg',{user:users.get(s.id),text:m});});\n  s.on('disconnect',()=>{users.delete(s.id);io.emit('users',[...users.values()]);});\n});",xf:"<strong>Système de chat complet</strong> client-serveur avec WebSockets. Idéal pour apprendre Socket.io.",te:"Real-time chat Socket.io",pe:"Node.js server + HTML/JS client for real-time chat. Nickname, messages, user list.",ee:"io.on('connection',s=>{s.on('join',n=>{users.set(s.id,n);io.emit('users',[...users.values()]);});s.on('chat',m=>{io.emit('msg',{user:users.get(s.id),text:m});});});",xe:"<strong>Complete chat system</strong> with WebSockets. Great for learning Socket.io.",tsp:"Chat tiempo real Socket.io",psp:"Servidor Node.js + cliente HTML/JS chat tiempo real. Apodo, mensajes, lista usuarios.",esp:"io.on('connection',s=>{s.on('join',n=>{users.set(s.id,n);io.emit('users',[...users.values()]);});s.on('chat',m=>{io.emit('msg',{user:users.get(s.id),text:m});});});",xsp:"<strong>Sistema de chat completo</strong> con WebSockets.",ta:"محادثة فورية Socket.io",pa:"خادم Node.js + عميل للمحادثة الفورية. اسم مستعار، رسائل، قائمة.",ea:"io.on('connection',s=>{s.on('join',n=>{users.set(s.id,n);io.emit('users',[...users.values()]);});s.on('chat',m=>{io.emit('msg',{user:users.get(s.id),text:m});});});",xa:"<strong>نظام محادثة كامل</strong>."},
{n:5,tf:"Formulaire multi-étapes React Hook Form + Zod",pf:"Composant React formulaire 3 étapes (infos, adresse, confirmation) avec React Hook Form et Zod. Navigation, persistance, récapitulatif.",ef:"const schema=z.object({name:z.string().min(2),email:z.string().email()});\nfunction Form(){const[step,setStep]=useState(1);const f=useForm({resolver:zodResolver(schema)});\nif(step===3)return<Summary data={f.getValues()}/>;\nreturn step===1?<Step1 form={f} onNext={()=>setStep(2)}/>:<Step2 form={f} onNext={()=>setStep(3)}/>;}",xf:"<strong>Formulaire multi-étapes pro</strong> avec validation temps réel Zod. Navigation fluide et résumé avant soumission.",te:"Multi-step form React Hook Form + Zod",pe:"React 3-step form component with React Hook Form and Zod. Navigation, persistence, summary.",ee:"const schema=z.object({name:z.string().min(2),email:z.string().email()});function Form(){const[step,setStep]=useState(1);const f=useForm({resolver:zodResolver(schema)});if(step===3)return<Summary data={f.getValues()}/>;return step===1?<Step1 form={f}/>:<Step2 form={f}/>;}",xe:"<strong>Professional multi-step form</strong> with real-time Zod validation.",tsp:"Formulario multi-pasos RHF + Zod",psp:"Componente React 3 pasos con React Hook Form y Zod. Navegación, persistencia, resumen.",esp:"const schema=z.object({name:z.string().min(2)});function Form(){const[step,setStep]=useState(1);const f=useForm({resolver:zodResolver(schema)});if(step===3)return<Summary data={f.getValues()}/>;return step===1?<Step1 form={f}/>:<Step2 form={f}/>;}",xsp:"<strong>Formulario multi-pasos profesional</strong> con validación Zod.",ta:"نموذج متعدد الخطوات RHF + Zod",pa:"مكون React لـ 3 خطوات مع React Hook Form و Zod. تنقل، حفظ، ملخص.",ea:"const schema=z.object({name:z.string().min(2)});function Form(){const[step,setStep]=useState(1);const f=useForm({resolver:zodResolver(schema)});if(step===3)return<Summary data={f.getValues()}/>;return step===1?<Step1 form={f}/>:<Step2 form={f}/>;}",xa:"<strong>نموذج متعدد الخطوات احترافي</strong> مع تحقق Zod."},
{n:6,tf:"Docker Compose LAMP",pf:"Fichier docker-compose.yml LAMP (Apache, MySQL, PHP) + phpMyAdmin. Volume [./src], réseau personnalisé.",ef:"services:\n  web:\n    image:php:8.2-apache\n    ports:['8080:80']\n    volumes:['./src:/var/www/html']\n  db:\n    image:mysql:8.0\n    environment:{MYSQL_ROOT_PASSWORD:root}\n  pma:\n    image:phpmyadmin\n    ports:['8081:80']\n    environment:{PMA_HOST:db}",xf:"<strong>Stack de dev complet</strong> en un fichier. Un <code>docker compose up</code> lance tout.",te:"Docker Compose LAMP",pe:"docker-compose.yml for LAMP (Apache, MySQL, PHP) + phpMyAdmin. Volume, custom network.",ee:"services:\n  web:\n    image:php:8.2-apache\n    ports:['8080:80']\n  db:\n    image:mysql:8.0\n  pma:\n    image:phpmyadmin\n    ports:['8081:80']",xe:"<strong>Complete dev stack</strong> in one file. One command starts everything.",tsp:"Docker Compose LAMP",psp:"docker-compose.yml LAMP + phpMyAdmin. Volumen, red personalizada.",esp:"services:\n  web:\n    image:php:8.2-apache\n    ports:['8080:80']\n  db:\n    image:mysql:8.0\n  pma:\n    image:phpmyadmin\n    ports:['8081:80']",xsp:"<strong>Stack de desarrollo completo</strong> en un archivo.",ta:"Docker Compose LAMP",pa:"ملف docker-compose.yml لـ LAMP + phpMyAdmin. مجلد، شبكة.",ea:"services:\n  web:\n    image:php:8.2-apache\n    ports:['8080:80']\n  db:\n    image:mysql:8.0\n  pma:\n    image:phpmyadmin\n    ports:['8081:80']",xa:"<strong>بيئة تطوير كاملة</strong> في ملف واحد."},
{n:7,tf:"Circuit Breaker appels externes",pf:"Ajoute pattern Circuit Breaker Node.js pour protéger appel API [service]. Utilise opossum. S'ouvre après [nombre] échecs.",ef:"const breaker=new CircuitBreaker(async(id)=>{const{data}=await axios.get(`https://api.svc.com/${id}`);return data;},{timeout:3000,errorThresholdPercentage:50,resetTimeout:10000});\nbreaker.fallback(id=>({cached:true,id}));\nbreaker.on('open',()=>console.log('Circuit ouvert!'));",xf:"<strong>Pattern de résilience</strong> essentiel. Protège les microservices des défaillances en cascade.",te:"Circuit Breaker external calls",pe:"Add Circuit Breaker pattern in Node.js to protect external API. Uses opossum.",ee:"const breaker=new CircuitBreaker(async(id)=>{const{data}=await axios.get(url);return data;},{timeout:3000,errorThresholdPercentage:50,resetTimeout:10000});breaker.fallback(id=>({cached:true,id}));",xe:"<strong>Essential resilience pattern</strong>. Protects microservices from cascading failures.",tsp:"Circuit Breaker llamadas externas",psp:"Añade patrón Circuit Breaker Node.js para proteger API externa. Usa opossum.",esp:"const breaker=new CircuitBreaker(async(id)=>{const{data}=await axios.get(url);return data;},{timeout:3000,errorThresholdPercentage:50,resetTimeout:10000});breaker.fallback(id=>({cached:true,id}));",xsp:"<strong>Patrón de resiliencia</strong> esencial para microservicios.",ta:"قاطع الدائرة للطلبات الخارجية",pa:"أضف نمط قاطع الدائرة في Node.js لحماية API خارجي. يستخدم opossum.",ea:"const breaker=new CircuitBreaker(async(id)=>{const{data}=await axios.get(url);return data;},{timeout:3000,errorThresholdPercentage:50,resetTimeout:10000});breaker.fallback(id=>({cached:true,id}));",xa:"<strong>نمط مرونة أساسي</strong> للميكروسيرفيسات."},
{n:8,tf:"Proxy API avec cache Redis",pf:"Serveur Node.js (Express) proxy pour [api-cible]. Cache GET avec TTL [ttl] dans Redis.",ef:"app.get('/api/*',async(req,res)=>{const key=req.originalUrl;const cached=await redis.get(key);if(cached)return res.json(JSON.parse(cached));const{data}=await axios.get(TARGET+req.originalUrl);await redis.setex(key,3600,JSON.stringify(data));res.json(data);});",xf:"<strong>Proxy avec cache intelligent</strong>. Réduit drastiquement latence et charge sur l'API externe.",te:"API proxy with Redis cache",pe:"Node.js Express proxy for target API. Caches GET responses with TTL in Redis.",ee:"app.get('/api/*',async(req,res)=>{const key=req.originalUrl;const cached=await redis.get(key);if(cached)return res.json(JSON.parse(cached));const{data}=await axios.get(TARGET+req.originalUrl);await redis.setex(key,3600,JSON.stringify(data));res.json(data);});",xe:"<strong>Smart caching proxy</strong>. Drastically reduces latency and load on external API.",tsp:"Proxy API con caché Redis",psp:"Servidor Node.js proxy para API objetivo. Cache GET con TTL en Redis.",esp:"app.get('/api/*',async(req,res)=>{const key=req.originalUrl;const cached=await redis.get(key);if(cached)return res.json(JSON.parse(cached));const{data}=await axios.get(TARGET+req.originalUrl);await redis.setex(key,3600,JSON.stringify(data));res.json(data);});",xsp:"<strong>Proxy con caché inteligente</strong>. Reduce drásticamente latencia.",ta:"وكيل API مع تخزين Redis",pa:"خادم Node.js وكيل لـ API هدف. تخزين GET مع TTL في Redis.",ea:"app.get('/api/*',async(req,res)=>{const key=req.originalUrl;const cached=await redis.get(key);if(cached)return res.json(JSON.parse(cached));const{data}=await axios.get(TARGET+req.originalUrl);await redis.setex(key,3600,JSON.stringify(data));res.json(data);});",xa:"<strong>وكيل مع تخزين مؤقت ذكي</strong>. يقلل زمن الاستجابة."},
{n:9,tf:"Automatiser publication WordPress API REST",pf:"Script Python utilisant API REST WordPress pour créer article [titre], [contenu], [catégories]. Basic Auth.",ef:"import requests\nfrom requests.auth import HTTPBasicAuth\nurl='https://site.com/wp-json/wp/v2/posts'\ndata={'title':'Article IA','content':'<p>Contenu</p>','status':'publish','categories':[5]}\nr=requests.post(url,json=data,auth=HTTPBasicAuth('user','pass'))\nprint(f'Créé: {r.json()[\"link\"]}')",xf:"<strong>Automatise la publication</strong> WordPress sans interface admin. Idéal pour contenu généré par IA.",te:"Automate WordPress publishing REST API",pe:"Python script using WordPress REST API to create post. Basic Auth.",ee:"import requests\nfrom requests.auth import HTTPBasicAuth\nr=requests.post('https://site.com/wp-json/wp/v2/posts',json={'title':'Post','content':'<p>Content</p>','status':'publish'},auth=HTTPBasicAuth('user','pass'))",xe:"<strong>Automates WordPress publishing</strong> without admin interface.",tsp:"Automatizar publicación WordPress API REST",psp:"Script Python API REST WordPress para crear artículo. Basic Auth.",esp:"import requests\nr=requests.post('https://site.com/wp-json/wp/v2/posts',json={'title':'Artículo','content':'<p>Contenido</p>','status':'publish'},auth=HTTPBasicAuth('user','pass'))",xsp:"<strong>Automatiza la publicación</strong> WordPress sin interfaz admin.",ta:"أتمتة نشر ووردبريس API REST",pa:"سكريبت Python يستخدم WordPress REST API لإنشاء مقال.",ea:"import requests\nr=requests.post('https://site.com/wp-json/wp/v2/posts',json={'title':'مقال','content':'<p>محتوى</p>','status':'publish'},auth=HTTPBasicAuth('user','pass'))",xa:"<strong>أتمتة النشر</strong> في ووردبريس دون واجهة."},
{n:10,tf:"Intégration API OpenAI pour emails",pf:"Fonction Node.js utilisant API OpenAI (chat/completions) pour répondre à un email [corps] avec [contexte]. Température paramétrable.",ef:"import OpenAI from 'openai';\nconst openai=new OpenAI({apiKey:process.env.OPENAI_KEY});\nasync function replyEmail(body,ctx){\n  const c=await openai.chat.completions.create({\n    model:'gpt-4o',temperature:0.7,\n    messages:[{role:'system',content:`Contexte:${ctx}`},{role:'user',content:`Réponds:${body}`}]\n  });\n  return c.choices[0].message.content;\n}",xf:"<strong>Automatise les réponses email</strong> avec contexte métier. Température ajustable pour la créativité.",te:"OpenAI API for email replies",pe:"Node.js function using OpenAI chat/completions to reply to email with context. Adjustable temperature.",ee:"const c=await openai.chat.completions.create({model:'gpt-4o',temperature:0.7,messages:[{role:'system',content:`Context:${ctx}`},{role:'user',content:`Reply:${body}`}]});return c.choices[0].message.content;",xe:"<strong>Automates email replies</strong> with business context. Adjustable creativity.",tsp:"API OpenAI para responder correos",psp:"Función Node.js usando OpenAI para responder correos con contexto. Temperatura ajustable.",esp:"const c=await openai.chat.completions.create({model:'gpt-4o',temperature:0.7,messages:[{role:'system',content:`Contexto:${ctx}`},{role:'user',content:`Responde:${body}`}]});return c.choices[0].message.content;",xsp:"<strong>Automatiza respuestas</strong> de correo con contexto.",ta:"دمج OpenAI للرد على البريد",pa:"دالة Node.js تستخدم OpenAI للرد على البريد مع سياق. حرارة قابلة للتعديل.",ea:"const c=await openai.chat.completions.create({model:'gpt-4o',temperature:0.7,messages:[{role:'system',content:`سياق:${ctx}`},{role:'user',content:`رد:${body}`}]});return c.choices[0].message.content;",xa:"<strong>أتمتة الردود</strong> على البريد مع سياق."},
{n:11,tf:"Pipeline CI/CD GitHub Actions → FTP",pf:"Fichier .github/workflows/deploy.yml qui, à chaque push sur main, utilise lftp pour transférer les fichiers du dossier [build] vers un serveur FTP.",ef:"name: Deploy\non:\n  push:\n    branches: [main]\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm run build\n      - run: |\n          sudo apt install lftp\n          lftp -e \"mirror -R ./dist /\" -u ${{secrets.FTP_USER}},${{secrets.FTP_PASS}} ${{secrets.FTP_HOST}}",xf:"<strong>Déploiement automatique</strong> à chaque push. L'IA génère le workflow YAML complet avec installation, build et transfert FTP.",te:"CI/CD Pipeline GitHub Actions → FTP",pe:".github/workflows/deploy.yml that on push to main uses lftp to transfer [build] folder to FTP.",ee:"name:Deploy\non:push:branches:[main]\njobs:deploy:runs-on:ubuntu-latest\nsteps:\n  - uses:actions/checkout@v4\n  - run:npm ci&&npm run build\n  - run:lftp -e \"mirror -R ./dist /\" -u ${{secrets.USER}},${{secrets.PASS}} ${{secrets.HOST}}",xe:"<strong>Automatic deployment</strong> on push. AI generates complete YAML workflow.",tsp:"Pipeline CI/CD GitHub Actions → FTP",psp:"Archivo .github/workflows/deploy.yml que en push a main usa lftp para transferir [build] a FTP.",esp:"name:Deploy\non:push:branches:[main]\njobs:deploy:runs-on:ubuntu-latest\nsteps:\n  - uses:actions/checkout@v4\n  - run:npm ci&&npm run build\n  - run:lftp -e \"mirror -R ./dist /\" -u ${{secrets.USER}},${{secrets.PASS}} ${{secrets.HOST}}",xsp:"<strong>Despliegue automático</strong> en cada push.",ta:"خط أنابيب CI/CD للنشر FTP",pa:"ملف .github/workflows/deploy.yml ينقل الملفات عند push لـ main إلى FTP.",ea:"name:Deploy\non:push:branches:[main]\njobs:deploy:runs-on:ubuntu-latest\nsteps:\n  - uses:actions/checkout@v4\n  - run:npm ci&&npm run build\n  - run:lftp -e \"mirror -R ./dist /\" -u ${{secrets.USER}},${{secrets.PASS}} ${{secrets.HOST}}",xa:"<strong>نشر تلقائي</strong> عند كل push."},
{n:12,tf:"Automatiser formulaires web avec Playwright",pf:"Script Playwright (Node.js) se connectant sur [site] avec [email/mdp], remplissant un formulaire [type] avec [données], et soumettant.",ef:"const{chromium}=require('playwright');\n(async()=>{\n  const b=await chromium.launch();\n  const p=await b.newPage();\n  await p.goto('https://site.com/login');\n  await p.fill('#email','user@demo.com');\n  await p.fill('#password','secret');\n  await p.click('button[type=submit]');\n  await p.fill('#field1','valeur');\n  await p.click('#submit');\n  await b.close();\n})();",xf:"<strong>Automatisation robuste</strong> de formulaires web. Playwright gère l'auth, le remplissage et la soumission comme un vrai navigateur.",te:"Automate web forms with Playwright",pe:"Playwright script logging into [site], filling a [type] form with [data], and submitting.",ee:"const{chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto(url);await p.fill('#email',u);await p.fill('#pass',pw);await p.click('button');await b.close();})();",xe:"<strong>Robust web automation</strong>. Playwright handles auth, filling and submission like a real browser.",tsp:"Automatizar formularios con Playwright",psp:"Script Playwright que inicia sesión, rellena formulario y envía.",esp:"const{chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto(url);await p.fill('#email',u);await p.click('button');await b.close();})();",xsp:"<strong>Automatización web robusta</strong> con Playwright.",ta:"أتمتة النماذج مع Playwright",pa:"سكريبت Playwright يسجل الدخول ويملأ نموذجاً ويرسله.",ea:"const{chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto(url);await p.fill('#email',u);await p.click('button');await b.close();})();",xa:"<strong>أتمتة ويب قوية</strong> مع Playwright."},
{n:13,tf:"Transcription audio OpenAI Whisper",pf:"Code Python utilisant l'API OpenAI Whisper pour transcrire un fichier audio [fichier.mp3] en texte. Gestion des gros fichiers par découpage.",ef:"from openai import OpenAI\nclient=OpenAI()\ndef transcribe(path):\n  with open(path,'rb') as f:\n    return client.audio.transcriptions.create(model='whisper-1',file=f,language='fr').text\nprint(transcribe('audio.mp3'))",xf:"<strong>Transcription audio précise</strong> via API Whisper. L'IA gère le découpage automatique pour les fichiers volumineux.",te:"Audio transcription OpenAI Whisper",pe:"Python code using OpenAI Whisper API to transcribe audio file to text. Handles large files by chunking.",ee:"from openai import OpenAI\nclient=OpenAI()\ndef transcribe(path):\n  with open(path,'rb') as f:\n    return client.audio.transcriptions.create(model='whisper-1',file=f).text",xe:"<strong>Accurate audio transcription</strong> via Whisper API. Handles large files.",tsp:"Transcripción audio OpenAI Whisper",psp:"Código Python usando API Whisper para transcribir audio a texto.",esp:"from openai import OpenAI\nclient=OpenAI()\ndef transcribe(path):\n  with open(path,'rb') as f:\n    return client.audio.transcriptions.create(model='whisper-1',file=f).text",xsp:"<strong>Transcripción precisa</strong> vía API Whisper.",ta:"تفريغ الصوت OpenAI Whisper",pa:"كود Python لتحويل الصوت إلى نص باستخدام Whisper.",ea:"from openai import OpenAI\nclient=OpenAI()\ndef transcribe(path):\n  with open(path,'rb') as f:\n    return client.audio.transcriptions.create(model='whisper-1',file=f).text",xa:"<strong>تفريغ صوتي دقيق</strong> عبر Whisper."},
{n:14,tf:"Monitoring performance Lighthouse",pf:"Script Node.js utilisant lighthouse en mode programme pour auditer l'URL [url], extraire le score Performance et le loguer/envoyer dans Datadog.",ef:"const lighthouse=require('lighthouse');\nconst chromeLauncher=require('chrome-launcher');\nasync function audit(url){\n  const chrome=await chromeLauncher.launch();\n  const{report}=await lighthouse(url,{port:chrome.port,onlyCategories:['performance']});\n  const score=JSON.parse(report).categories.performance.score*100;\n  console.log(`Score: ${score}`);\n  await chrome.kill();\n  return score;\n}",xf:"<strong>Audit de performance automatisé</strong>. Mesure objective du score Lighthouse, intégrable dans une CI/CD.",te:"Performance monitoring Lighthouse",pe:"Node.js script using lighthouse programmatically to audit URL and extract Performance score.",ee:"const lighthouse=require('lighthouse');const chromeLauncher=require('chrome-launcher');async function audit(url){const chrome=await chromeLauncher.launch();const{report}=await lighthouse(url,{port:chrome.port,onlyCategories:['performance']});const score=JSON.parse(report).categories.performance.score*100;return score;}",xe:"<strong>Automated performance audit</strong>. Objective Lighthouse score, CI/CD ready.",tsp:"Monitorización rendimiento Lighthouse",psp:"Script Node.js usando lighthouse para auditar URL y extraer score de rendimiento.",esp:"const lighthouse=require('lighthouse');const chromeLauncher=require('chrome-launcher');async function audit(url){const chrome=await chromeLauncher.launch();const{report}=await lighthouse(url,{port:chrome.port});const score=JSON.parse(report).categories.performance.score*100;return score;}",xsp:"<strong>Auditoría de rendimiento automatizada</strong>.",ta:"مراقبة الأداء Lighthouse",pa:"سكريبت Node.js لتدقيق الأداء واستخراج النتيجة.",ea:"const lighthouse=require('lighthouse');const chromeLauncher=require('chrome-launcher');async function audit(url){const chrome=await chromeLauncher.launch();const{report}=await lighthouse(url,{port:chrome.port});const score=JSON.parse(report).categories.performance.score*100;return score;}",xa:"<strong>تدقيق أداء آلي</strong>."},
{n:15,tf:"Optimiser requête SQL avec EXPLAIN",pf:"Explique comment utiliser EXPLAIN ANALYZE sur la requête [requête]. Interprète les résultats et propose les indexes à créer.",ef:"EXPLAIN ANALYZE\nSELECT u.name, COUNT(o.id)\nFROM users u\nLEFT JOIN orders o ON u.id=o.user_id\nWHERE u.created_at > '2025-01-01'\nGROUP BY u.id;\n\n-- Résultat: Seq Scan → Créer index:\nCREATE INDEX idx_users_created ON users(created_at);\nCREATE INDEX idx_orders_user ON orders(user_id);",xf:"<strong>Analyse de performance SQL</strong>. L'IA lit le plan d'exécution, identifie les goulots (Seq Scan) et propose les index optimaux.",te:"Optimize SQL query with EXPLAIN",pe:"Explain how to use EXPLAIN ANALYZE on query. Interpret results and suggest indexes.",ee:"EXPLAIN ANALYZE SELECT u.name,COUNT(o.id) FROM users u LEFT JOIN orders o ON u.id=o.user_id GROUP BY u.id;\n-- Seq Scan detected → CREATE INDEX idx_users_created ON users(created_at);",xe:"<strong>SQL performance analysis</strong>. AI reads execution plan and suggests optimal indexes.",tsp:"Optimizar consulta SQL con EXPLAIN",psp:"Explica cómo usar EXPLAIN ANALYZE, interpreta resultados y sugiere índices.",esp:"EXPLAIN ANALYZE SELECT u.name,COUNT(o.id) FROM users u LEFT JOIN orders o ON u.id=o.user_id GROUP BY u.id;\n-- Seq Scan → CREATE INDEX idx_users_created ON users(created_at);",xsp:"<strong>Análisis de rendimiento SQL</strong> con sugerencia de índices.",ta:"تحسين استعلام SQL مع EXPLAIN",pa:"اشرح استخدام EXPLAIN ANALYZE وفسر النتائج واقترح فهارس.",ea:"EXPLAIN ANALYZE SELECT u.name,COUNT(o.id) FROM users u LEFT JOIN orders o ON u.id=o.user_id GROUP BY u.id;\n-- Seq Scan → CREATE INDEX idx_users_created ON users(created_at);",xa:"<strong>تحليل أداء SQL</strong> مع اقتراح فهارس."},
{n:16,tf:"Migrer JavaScript vers TypeScript",pf:"Plan en 5 étapes pour migrer un projet [nom] vers TypeScript : tsconfig, renommage, correction des erreurs strictes, ajout progressif de typages.",ef:"// Étape 1: tsconfig.json\n{\"compilerOptions\":{\"strict\":true,\"noImplicitAny\":true,\"allowJs\":true}}\n// Étape 2: Renommer fichier.js → fichier.ts\n// Étape 3: Ajouter types progressivement\nfunction greet(name:string):string{return `Hello ${name}`;}\n// Étape 4: Activer strictNullChecks\n// Étape 5: Supprimer allowJs",xf:"<strong>Plan de migration structuré</strong> pour passer de JS à TS sans casser l'existant. Approche progressive et sécurisée.",te:"Migrate JavaScript to TypeScript",pe:"5-step plan to migrate project to TypeScript: tsconfig, renaming, fixing strict errors, progressive typing.",ee:"// Step 1: tsconfig with strict:true\n// Step 2: Rename .js → .ts\n// Step 3: Add types gradually\nfunction greet(name:string):string{return`Hello ${name}`;}",xe:"<strong>Structured migration plan</strong> from JS to TS without breaking existing code.",tsp:"Migrar JavaScript a TypeScript",psp:"Plan de 5 pasos para migrar proyecto a TypeScript.",esp:"// Paso 1: tsconfig strict:true\n// Paso 2: Renombrar .js → .ts\n// Paso 3: Añadir tipos\ngreet(name:string):string{return`Hola ${name}`;}",xsp:"<strong>Plan de migración estructurado</strong> de JS a TS.",ta:"ترحيل JavaScript إلى TypeScript",pa:"خطة من 5 خطوات لترحيل مشروع إلى TypeScript.",ea:"// خطوة 1: tsconfig مع strict:true\n// خطوة 2: إعادة تسمية .js → .ts\n// خطوة 3: إضافة أنواع\ngreet(name:string):string{return`مرحباً ${name}`;}",xa:"<strong>خطة ترحيل منظمة</strong> من JS إلى TS."},
{n:17,tf:"Corriger une race condition en base de données",pf:"Résoudre une race condition sur un compteur en base. Verrou optimiste avec colonne version, ou SELECT...FOR UPDATE. Code SQL et application.",ef:"-- Verrou pessimiste\nBEGIN;\nSELECT stock FROM products WHERE id=1 FOR UPDATE;\nUPDATE products SET stock=stock-1 WHERE id=1 AND stock>0;\nCOMMIT;\n\n-- Verrou optimiste (application)\nUPDATE products SET stock=stock-1, version=version+1\nWHERE id=1 AND version=5;",xf:"<strong>Protection contre les accès concurrents</strong>. L'IA explique les deux approches (pessimiste/optimiste) avec code prêt à l'emploi.",te:"Fix database race condition",pe:"Resolve race condition on a counter. Optimistic lock with version column or SELECT...FOR UPDATE.",ee:"-- Pessimistic\nBEGIN;SELECT stock FROM products WHERE id=1 FOR UPDATE;UPDATE products SET stock=stock-1 WHERE id=1 AND stock>0;COMMIT;\n-- Optimistic\nUPDATE products SET stock=stock-1, version=version+1 WHERE id=1 AND version=5;",xe:"<strong>Concurrency protection</strong>. Both pessimistic and optimistic locking explained with code.",tsp:"Corregir condición de carrera en BD",psp:"Resolver race condition con bloqueo optimista (versión) o SELECT...FOR UPDATE.",esp:"-- Pesimista\nBEGIN;SELECT stock FROM products WHERE id=1 FOR UPDATE;UPDATE products SET stock=stock-1 WHERE id=1 AND stock>0;COMMIT;\n-- Optimista\nUPDATE products SET stock=stock-1, version=version+1 WHERE id=1 AND version=5;",xsp:"<strong>Protección contra concurrencia</strong> con ambos enfoques.",ta:"إصلاح حالة تسابق في قاعدة البيانات",pa:"حل مشكلة تسابق باستخدام قفل متفائل أو SELECT...FOR UPDATE.",ea:"-- متشائم\nBEGIN;SELECT stock FROM products WHERE id=1 FOR UPDATE;UPDATE products SET stock=stock-1 WHERE id=1 AND stock>0;COMMIT;\n-- متفائل\nUPDATE products SET stock=stock-1, version=version+1 WHERE id=1 AND version=5;",xa:"<strong>حماية من التزامن</strong>."},
{n:18,tf:"Optimiser le SSR d'une page Next.js",pf:"Techniques pour réduire le TTFB d'une page Next.js : cache getServerSideProps, réduction des dépendances serveur, streaming HTML. Exemple pratique.",ef:"// Avec cache\nexport async function getServerSideProps(ctx){\n  const cacheKey=`page:${ctx.params.id}`;\n  const cached=await redis.get(cacheKey);\n  if(cached) return {props:{data:JSON.parse(cached)}};\n  const data=await fetchData(ctx.params.id);\n  await redis.setex(cacheKey,300,JSON.stringify(data));\n  return {props:{data}};\n}",xf:"<strong>Réduction du TTFB</strong> via cache Redis sur getServerSideProps. L'IA montre comment éviter les appels DB répétés.",te:"Optimize Next.js page SSR",pe:"Techniques to reduce TTFB: cache getServerSideProps, reduce server deps, HTML streaming.",ee:"export async function getServerSideProps(ctx){const cached=await redis.get(`page:${ctx.params.id}`);if(cached)return{props:{data:JSON.parse(cached)}};const data=await fetchData(ctx.params.id);await redis.setex(`page:${ctx.params.id}`,300,JSON.stringify(data));return{props:{data}};}",xe:"<strong>TTFB reduction</strong> via Redis cache on getServerSideProps.",tsp:"Optimizar SSR de página Next.js",psp:"Técnicas para reducir TTFB: cachear getServerSideProps, reducir dependencias.",esp:"export async function getServerSideProps(ctx){const cached=await redis.get(`page:${ctx.params.id}`);if(cached)return{props:{data:JSON.parse(cached)}};const data=await fetchData(ctx.params.id);await redis.setex(`page:${ctx.params.id}`,300,JSON.stringify(data));return{props:{data}};}",xsp:"<strong>Reducción de TTFB</strong> con caché Redis.",ta:"تحسين SSR لصفحة Next.js",pa:"تقنيات لتقليل TTFB: تخزين getServerSideProps مؤقتاً.",ea:"export async function getServerSideProps(ctx){const cached=await redis.get(`page:${ctx.params.id}`);if(cached)return{props:{data:JSON.parse(cached)}};const data=await fetchData(ctx.params.id);await redis.setex(`page:${ctx.params.id}`,300,JSON.stringify(data));return{props:{data}};}",xa:"<strong>تقليل TTFB</strong> عبر تخزين Redis مؤقت."},
{n:19,tf:"Appliquer les principes SOLID",pf:"Choisis une classe [classe] violant le principe de responsabilité unique. Réécris-la en appliquant les principes SOLID adaptés, en justifiant chaque modification.",ef:"// AVANT : classe multi-responsabilité\nclass UserService{\n  saveToDB(user){/*...*/}\n  sendEmail(user,msg){/*...*/}\n  generatePDF(user){/*...*/}\n}\n// APRÈS : responsabilités séparées\nclass UserRepository{save(user){/*...*/}}\nclass EmailService{send(user,msg){/*...*/}}\nclass PDFGenerator{generate(user){/*...*/}}",xf:"<strong>Refactoring orienté SOLID</strong>. L'IA identifie les violations et propose une architecture propre avec séparation des responsabilités.",te:"Apply SOLID principles",pe:"Pick a class violating Single Responsibility Principle. Rewrite it applying SOLID principles.",ee:"// BEFORE: multi-responsibility\nclass UserService{saveToDB(u){/**/}sendEmail(u,m){/**/}generatePDF(u){/**/}}\n// AFTER: separated\nclass UserRepository{save(u){/**/}}\nclass EmailService{send(u,m){/**/}}\nclass PDFGenerator{generate(u){/**/}}",xe:"<strong>SOLID-oriented refactoring</strong>. AI identifies violations and proposes clean architecture.",tsp:"Aplicar principios SOLID",psp:"Elige clase que viole SRP. Reescríbela aplicando principios SOLID.",esp:"// ANTES: multi-responsabilidad\nclass UserService{saveToDB(u){/**/}sendEmail(u,m){/**/}}\n// DESPUÉS\nclass UserRepository{save(u){/**/}}\nclass EmailService{send(u,m){/**/}}",xsp:"<strong>Refactorización SOLID</strong> con separación de responsabilidades.",ta:"تطبيق مبادئ SOLID",pa:"اختر صنفاً يخالف مبدأ المسؤولية الواحدة. أعد كتابته بتطبيق SOLID.",ea:"// قبل\nclass UserService{saveToDB(u){/**/}sendEmail(u,m){/**/}}\n// بعد\nclass UserRepository{save(u){/**/}}\nclass EmailService{send(u,m){/**/}}",xa:"<strong>إعادة بناء SOLID</strong> مع فصل المسؤوليات."},
{n:20,tf:"Refactoriser un reducer Redux avec Redux Toolkit",pf:"Migration d'un reducer Redux classique avec switch/case vers createSlice de Redux Toolkit. Simplification et utilisation d'immer.",ef:"// AVANT\nfunction todoReducer(state=[],action){\n  switch(action.type){\n    case'ADD':return[...state,{...action.payload,id:Date.now()}];\n    case'TOGGLE':return state.map(t=>t.id===action.payload?{...t,done:!t.done}:t);\n    default:return state;\n  }\n}\n// APRÈS\nconst todoSlice=createSlice({\n  name:'todos',\n  initialState:[],\n  reducers:{\n    add(state,action){state.push({...action.payload,id:Date.now()});},\n    toggle(state,action){const t=state.find(t=>t.id===action.payload);if(t)t.done=!t.done;}\n  }\n});",xf:"<strong>Code 2x plus court</strong> avec createSlice. Immer permet la mutation directe, Redux Toolkit génère automatiquement les actions.",te:"Refactor Redux reducer with Redux Toolkit",pe:"Migrate classic Redux reducer with switch/case to createSlice. Uses immer.",ee:"// BEFORE: switch/case\n// AFTER:\nconst todoSlice=createSlice({name:'todos',initialState:[],reducers:{add(state,action){state.push({...action.payload,id:Date.now()});},toggle(state,action){const t=state.find(t=>t.id===action.payload);if(t)t.done=!t.done;}}});",xe:"<strong>2x shorter code</strong> with createSlice. Immer enables direct mutation.",tsp:"Refactorizar reducer Redux con Redux Toolkit",psp:"Migrar reducer Redux clásico a createSlice. Usa immer.",esp:"const todoSlice=createSlice({name:'todos',initialState:[],reducers:{add(state,action){state.push({...action.payload,id:Date.now()});},toggle(state,action){const t=state.find(t=>t.id===action.payload);if(t)t.done=!t.done;}}});",xsp:"<strong>Código 2x más corto</strong> con createSlice.",ta:"إعادة بناء مخفض Redux مع Redux Toolkit",pa:"ترحيل مخفض Redux كلاسيكي إلى createSlice. يستخدم immer.",ea:"const todoSlice=createSlice({name:'todos',initialState:[],reducers:{add(state,action){state.push({...action.payload,id:Date.now()});},toggle(state,action){const t=state.find(t=>t.id===action.payload);if(t)t.done=!t.done;}}});",xa:"<strong>كود أقصر بمرتين</strong> مع createSlice."},
{n:21,tf:"Tests unitaires Jest pour une fonction",pf:"Écris un ensemble de tests unitaires Jest pour la fonction [fonction] exportée de [utils.js]. Couvre les cas nominaux, limites et exceptions. describe/it.",ef:"import { add } from './utils';\ndescribe('add',()=>{\n  it('additionne 2+3=5',()=>{expect(add(2,3)).toBe(5);});\n  it('gère les nombres négatifs',()=>{expect(add(-2,3)).toBe(1);});\n  it('rejette les chaînes',()=>{expect(()=>add('a',3)).toThrow();});\n});",xf:"<strong>Tests unitaires complets</strong> avec couverture des cas nominaux, limites et exceptions. Structure describe/it standard.",te:"Jest unit tests for a function",pe:"Write Jest unit tests for function exported from utils.js. Cover nominal, edge cases and exceptions.",ee:"import{add}from'./utils';describe('add',()=>{it('adds 2+3=5',()=>{expect(add(2,3)).toBe(5);});it('handles negatives',()=>{expect(add(-2,3)).toBe(1);});it('rejects strings',()=>{expect(()=>add('a',3)).toThrow();});});",xe:"<strong>Complete unit tests</strong> covering nominal, edge and exception cases.",tsp:"Tests unitarios Jest para función",psp:"Escribe tests unitarios Jest para función en utils.js. Casos nominales, límite, excepciones.",esp:"import{add}from'./utils';describe('add',()=>{it('suma 2+3=5',()=>{expect(add(2,3)).toBe(5);});it('maneja negativos',()=>{expect(add(-2,3)).toBe(1);});});",xsp:"<strong>Tests unitarios completos</strong> con casos límite.",ta:"اختبارات وحدة Jest لدالة",pa:"اكتب اختبارات Jest لدالة من utils.js. حالات طبيعية، حدية، استثناءات.",ea:"import{add}from'./utils';describe('add',()=>{it('يجمع 2+3=5',()=>{expect(add(2,3)).toBe(5);});it('يتعامل مع السالب',()=>{expect(add(-2,3)).toBe(1);});});",xa:"<strong>اختبارات وحدة كاملة</strong>."},
{n:22,tf:"Test de charge avec k6",pf:"Script k6 (JavaScript) pour tester la montée en charge de GET [api/endpoint]. Scénario : 0 à 50 utilisateurs en 2 min, maintien 3 min. Erreur <1%.",ef:"import http from 'k6/http';\nimport { check } from 'k6';\nexport const options={\n  stages:[\n    {duration:'2m',target:50},\n    {duration:'3m',target:50},\n    {duration:'1m',target:0}\n  ],\n  thresholds:{http_req_failed:['rate<0.01']}\n};\nexport default function(){const r=http.get('https://api.demo.com/endpoint');check(r,{'status 200':(r)=>r.status===200});}",xf:"<strong>Test de montée en charge réaliste</strong>. k6 simule 50 utilisateurs avec seuil d'erreur <1%. Intégrable en CI.",te:"Load test with k6",pe:"k6 script to load test GET endpoint. 0 to 50 users in 2min, sustain 3min. Error <1%.",ee:"import http from'k6/http';import{check}from'k6';export const options={stages:[{duration:'2m',target:50},{duration:'3m',target:50}]};export default function(){const r=http.get('https://api.demo.com');check(r,{'status 200':(r)=>r.status===200});}",xe:"<strong>Realistic load test</strong>. k6 simulates 50 users with <1% error threshold.",tsp:"Test de carga con k6",psp:"Script k6 para test de carga GET endpoint. 0 a 50 usuarios en 2min, mantener 3min.",esp:"import http from'k6/http';export const options={stages:[{duration:'2m',target:50},{duration:'3m',target:50}]};export default function(){const r=http.get('https://api.demo.com');check(r,{'status 200':(r)=>r.status===200});}",xsp:"<strong>Test de carga realista</strong> con k6.",ta:"اختبار حمل مع k6",pa:"سكريبت k6 لاختبار حمل GET. من 0 إلى 50 مستخدم في دقيقتين.",ea:"import http from'k6/http';export const options={stages:[{duration:'2m',target:50},{duration:'3m',target:50}]};export default function(){const r=http.get('https://api.demo.com');check(r,{'status 200':(r)=>r.status===200});}",xa:"<strong>اختبار حمل واقعي</strong>."},
{n:23,tf:"Tests de mutation avec Stryker",pf:"Comment configurer et exécuter Stryker sur un projet JavaScript pour évaluer la qualité des tests. Interprétation d'un rapport de mutation.",ef:"// stryker.config.json\n{\n  \"mutator\":\"javascript\",\n  \"packageManager\":\"npm\",\n  \"reporters\":[\"html\",\"clear-text\",\"progress\"],\n  \"testRunner\":\"jest\",\n  \"coverageAnalysis\":\"perTest\"\n}\n// Rapport: 85% mutation score → bonne qualité",xf:"<strong>Évalue la qualité réelle des tests</strong>. Stryker modifie le code (mutants) et vérifie si les tests échouent. Score >80% = excellent.",te:"Mutation testing with Stryker",pe:"Configure and run Stryker on JS project to assess test quality. Interpret mutation report.",ee:"// stryker.config.json\n{\"mutator\":\"javascript\",\"testRunner\":\"jest\",\"reporters\":[\"html\",\"clear-text\"]}\n// Report: 85% mutation score = good quality",xe:"<strong>Evaluates real test quality</strong>. Stryker mutates code and checks if tests catch it.",tsp:"Tests de mutación con Stryker",psp:"Configurar Stryker en proyecto JS para evaluar calidad de tests.",esp:"// stryker.config.json\n{\"mutator\":\"javascript\",\"testRunner\":\"jest\",\"reporters\":[\"html\"]}\n// Informe: 85% = buena calidad",xsp:"<strong>Evalúa calidad real de tests</strong> con Stryker.",ta:"اختبارات طفرات مع Stryker",pa:"تكوين Stryker على مشروع JS لتقييم جودة الاختبارات.",ea:"// stryker.config.json\n{\"mutator\":\"javascript\",\"testRunner\":\"jest\"}\n// تقرير: 85% = جودة جيدة",xa:"<strong>تقييم جودة الاختبارات الحقيقية</strong>."},
{n:24,tf:"Tests de propriétés avec Fast-Check",pf:"Exemple de test de propriétés en JavaScript avec fast-check pour une fonction [triParInsertion]. Vérifie que le tableau trié est toujours trié.",ef:"import fc from 'fast-check';\ntest('le tableau trié est toujours trié',()=>{\n  fc.assert(fc.property(fc.array(fc.integer()),arr=>{\n    const sorted=insertionSort([...arr]);\n    for(let i=1;i<sorted.length;i++){if(sorted[i-1]>sorted[i])return false;}\n    return true;\n  }));\n});",xf:"<strong>Tests basés sur les propriétés</strong>. Fast-Check génère des milliers de cas aléatoires pour vérifier une propriété invariante.",te:"Property-based testing with Fast-Check",pe:"Property-based test example with fast-check for insertion sort. Verifies sorted array stays sorted.",ee:"import fc from'fast-check';test('sorted array is always sorted',()=>{fc.assert(fc.property(fc.array(fc.integer()),arr=>{const sorted=insertionSort([...arr]);for(let i=1;i<sorted.length;i++){if(sorted[i-1]>sorted[i])return false;}return true;}));});",xe:"<strong>Property-based testing</strong>. Fast-Check generates thousands of random cases.",tsp:"Tests basados en propiedades Fast-Check",psp:"Test de propiedades con fast-check para ordenación. Verifica array ordenado.",esp:"import fc from'fast-check';test('array ordenado',()=>{fc.assert(fc.property(fc.array(fc.integer()),arr=>{const s=insertionSort([...arr]);for(let i=1;i<s.length;i++){if(s[i-1]>s[i])return false;}return true;}));});",xsp:"<strong>Tests basados en propiedades</strong>. Genera miles de casos.",ta:"اختبارات خصائص مع Fast-Check",pa:"اختبار خصائص للترتيب. يتحقق أن المصفوفة المرتبة تبقى مرتبة.",ea:"import fc from'fast-check';test('مصفوفة مرتبة',()=>{fc.assert(fc.property(fc.array(fc.integer()),arr=>{const s=insertionSort([...arr]);for(let i=1;i<s.length;i++){if(s[i-1]>s[i])return false;}return true;}));});",xa:"<strong>اختبارات قائمة على الخصائص</strong>."},
{n:25,tf:"Mocking d'API avec MSW",pf:"Configuration de MSW pour intercepter les appels réseau dans les tests React. Mocke un endpoint GET [api/user] et retourne un utilisateur fictif.",ef:"import{http,HttpResponse}from'msw';\nimport{setupServer}from'msw/node';\nconst server=setupServer(\n  http.get('/api/user',()=>HttpResponse.json({id:1,name:'Alice',email:'alice@demo.com'}))\n);\nbeforeAll(()=>server.listen());\nafterEach(()=>server.resetHandlers());\nafterAll(()=>server.close());",xf:"<strong>Mock réseau puissant</strong>. MSW intercepte les appels fetch/axios au niveau réseau, rendant les tests plus réalistes et sans dépendances externes.",te:"API mocking with MSW",pe:"MSW configuration to intercept network calls in React tests. Mocks GET endpoint and returns fake user.",ee:"import{http,HttpResponse}from'msw';import{setupServer}from'msw/node';const server=setupServer(http.get('/api/user',()=>HttpResponse.json({id:1,name:'Alice'})));beforeAll(()=>server.listen());afterAll(()=>server.close());",xe:"<strong>Powerful network mocking</strong>. MSW intercepts fetch/axios at network level.",tsp:"Mocking API con MSW",psp:"Configuración MSW para interceptar llamadas red en tests React.",esp:"import{http,HttpResponse}from'msw';const server=setupServer(http.get('/api/user',()=>HttpResponse.json({id:1,name:'Alice'})));beforeAll(()=>server.listen());",xsp:"<strong>Mock de red potente</strong> con MSW.",ta:"محاكاة API مع MSW",pa:"تكوين MSW لاعتراض طلبات الشبكة في اختبارات React.",ea:"import{http,HttpResponse}from'msw';const server=setupServer(http.get('/api/user',()=>HttpResponse.json({id:1,name:'Alice'})));beforeAll(()=>server.listen());",xa:"<strong>محاكاة شبكة قوية</strong>."},
{n:26,tf:"Idées de business passif avec ChatGPT",pf:"5 idées de business utilisant ChatGPT comme technologie sous-jacente pour automatiser un service. Exemple : générateur de recettes, correcteur de CV.",ef:"Idées:\n1. Assistant de rédaction SEO automatisé\n2. Correcteur de CV + lettre de motivation\n3. Générateur de recettes personnalisées\n4. Chatbot support client par abonnement\n5. Résumeur de documents juridiques",xf:"<strong>Business automatisés par IA</strong>. ChatGPT peut être l'infrastructure de services vendus par abonnement.",te:"Passive business ideas with ChatGPT",pe:"5 business ideas using ChatGPT as underlying technology to automate a service.",ee:"Ideas:\n1. SEO writing assistant\n2. CV + cover letter corrector\n3. Personalized recipe generator\n4. Subscription customer support chatbot\n5. Legal document summarizer",xe:"<strong>AI-powered automated businesses</strong>. ChatGPT as infrastructure for subscription services.",tsp:"Ideas negocio pasivo con ChatGPT",psp:"5 ideas de negocio usando ChatGPT para automatizar un servicio.",esp:"Ideas:\n1. Asistente SEO\n2. Corrector CV\n3. Generador recetas\n4. Chatbot soporte\n5. Resumidor documentos",xsp:"<strong>Negocios automatizados con IA</strong>.",ta:"أفكار أعمال سلبية مع ChatGPT",pa:"5 أفكار أعمال تستخدم ChatGPT لأتمتة خدمة.",ea:"أفكار:\n1. مساعد SEO\n2. مصحح سيرة ذاتية\n3. مولد وصفات\n4. شات بوت دعم\n5. ملخص مستندات",xa:"<strong>أعمال آلية بالذكاء الاصطناعي</strong>."},
{n:27,tf:"Automatisation de la journée avec l'IA",pf:"Routine matinale de 2 heures optimisée avec des outils IA pour un entrepreneur [domaine]. Chaque bloc de 30 minutes avec les outils et prompts.",ef:"07h-07h30: Veille avec Perplexity → résumé IA\n07h30-08h: Rédaction contenu avec Claude\n08h-08h30: Gestion emails avec ChatGPT\n08h30-09h: Planification tâches avec Motion AI",xf:"<strong>Routine productive optimisée IA</strong>. Plan concret avec outils et plages horaires.",te:"Day automation with AI",pe:"2-hour morning routine optimized with AI tools for entrepreneur. Each 30min block with tools.",ee:"7:00-7:30: Monitoring with Perplexity\n7:30-8:00: Content writing with Claude\n8:00-8:30: Email management with ChatGPT\n8:30-9:00: Task planning with Motion",xe:"<strong>AI-optimized productive routine</strong>. Concrete plan with tools and time slots.",tsp:"Automatización del día con IA",psp:"Rutina matutina 2h optimizada con herramientas IA para emprendedor.",esp:"7:00-7:30: Monitoreo Perplexity\n7:30-8:00: Redacción Claude\n8:00-8:30: Correos ChatGPT\n8:30-9:00: Planificación Motion",xsp:"<strong>Rutina productiva optimizada con IA</strong>.",ta:"أتمتة اليوم بالذكاء الاصطناعي",pa:"روتين صباحي ساعتين محسن بأدوات الذكاء الاصطناعي.",ea:"7:00-7:30: مراقبة Perplexity\n7:30-8:00: كتابة Claude\n8:00-8:30: بريد ChatGPT\n8:30-9:00: تخطيط Motion",xa:"<strong>روتين إنتاجي محسن بالذكاء الاصطناعي</strong>."},
{n:28,tf:"Métriques clés pour un SaaS",pf:"10 métriques (KPI) les plus importantes à suivre pour un SaaS B2B en phase de croissance. Comment les calculer et quel benchmark viser.",ef:"1. MRR (Revenu Mensuel Récurrent)\n2. Churn Rate (Taux d'attrition) - Cible <5%\n3. LTV (Vie Client) - LTV/CAC >3\n4. CAC (Coût Acquisition Client)\n5. ARPU (Revenu Moyen par Utilisateur)\n6. Activation Rate - Cible >40%\n7. NPS (Net Promoter Score)\n8. Expansion Revenue\n9. Burn Rate\n10. Runway (mois restants)",xf:"<strong>Tableau de bord SaaS complet</strong>. Métriques essentielles avec formules de calcul et benchmarks.",te:"Key metrics for a SaaS",pe:"10 most important KPIs for B2B SaaS in growth phase. Calculation and benchmarks.",ee:"1.MRR 2.Churn<5% 3.LTV/CAC>3 4.CAC 5.ARPU 6.Activation>40% 7.NPS 8.Expansion Revenue 9.Burn Rate 10.Runway",xe:"<strong>Complete SaaS dashboard</strong>. Essential metrics with formulas and benchmarks.",tsp:"Métricas clave SaaS",psp:"10 KPIs más importantes para SaaS B2B en crecimiento. Cálculo y benchmarks.",esp:"1.MRR 2.Churn<5% 3.LTV/CAC>3 4.CAC 5.ARPU 6.Activación>40% 7.NPS 8.Expansión 9.Burn Rate 10.Runway",xsp:"<strong>Dashboard SaaS completo</strong> con métricas esenciales.",ta:"مقاييس SaaS الرئيسية",pa:"أهم 10 KPIs لـ SaaS B2B في مرحلة النمو.",ea:"1.MRR 2.Churn<5% 3.LTV/CAC>3 4.CAC 5.ARPU 6.Activation>40% 7.NPS 8.Expansion 9.Burn Rate 10.Runway",xa:"<strong>لوحة قيادة SaaS كاملة</strong>."},

        let L='fr',T='light',S='',CP=null,PG=1;
        const I={fr:{hb:'Sélection Premium',sp:'Prompts',sl:'Langues',cp:'📋 Copier',cd:'✓ Copié !',ph:'Rechercher...',dt:'💡 Détails',el:'💡 Exemple',xl:'📖 Explication',em:'Aucun résultat.',p1:{ht:'Les <span>10 Premiers</span> Prompts',hs:'Génération de code & API'},p2:{ht:'Prompts <span>11 à 20</span>',hs:'Automatisation, scripts, débogage & optimisation',c1:'⚡ Automatisation & scripts',c2:'🔧 Débogage, refactoring & optimisation'},p3:{ht:'Prompts <span>21 à 30</span>',hs:'Tests, qualité & stratégies avancées',c1:'✅ Tests & qualité',c2:'🚀 Bonus — Avancé & stratégique'}},en:{hb:'Premium Selection',sp:'Prompts',sl:'Languages',cp:'📋 Copy',cd:'✓ Copied!',ph:'Search...',dt:'💡 Details',el:'💡 Example',xl:'📖 Explanation',em:'No results.',p1:{ht:'The <span>First 10</span> Prompts',hs:'Code Generation & APIs'},p2:{ht:'Prompts <span>11 to 20</span>',hs:'Automation, scripts, debugging & optimization',c1:'⚡ Automation & Scripts',c2:'🔧 Debugging, Refactoring & Optimization'},p3:{ht:'Prompts <span>21 to 30</span>',hs:'Testing, quality & advanced strategies',c1:'✅ Testing & Quality',c2:'🚀 Bonus — Advanced & Strategy'}},sp:{hb:'Selección Premium',sp:'Prompts',sl:'Idiomas',cp:'📋 Copiar',cd:'✓ ¡Copiado!',ph:'Buscar...',dt:'💡 Detalles',el:'💡 Ejemplo',xl:'📖 Explicación',em:'Sin resultados.',p1:{ht:'Los <span>10 Primeros</span> Prompts',hs:'Generación de Código y APIs'},p2:{ht:'Prompts <span>11 a 20</span>',hs:'Automatización, scripts, depuración y optimización',c1:'⚡ Automatización y Scripts',c2:'🔧 Depuración, Refactoring y Optimización'},p3:{ht:'Prompts <span>21 a 30</span>',hs:'Pruebas, calidad y estrategias avanzadas',c1:'✅ Pruebas y Calidad',c2:'🚀 Bonus — Avanzado y Estrategia'}},ar:{hb:'تشكيلة مميزة',sp:'موجهات',sl:'لغات',cp:'📋 نسخ',cd:'✓ تم!',ph:'بحث...',dt:'💡 تفاصيل',el:'💡 مثال',xl:'📖 شرح',em:'لا نتائج.',p1:{ht:'أول <span>10</span> موجهات',hs:'توليد الكود وواجهات API'},p2:{ht:'الموجهات <span>11 إلى 20</span>',hs:'الأتمتة، السكريبتات، التصحيح والتحسين',c1:'⚡ الأتمتة والسكريبتات',c2:'🔧 تصحيح الأخطاء وإعادة البناء والتحسين'},p3:{ht:'الموجهات <span>21 إلى 30</span>',hs:'الاختبارات والجودة والاستراتيجيات المتقدمة',c1:'✅ الاختبارات والجودة',c2:'🚀 مكافأة — متقدم واستراتيجي'}}};
        function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
        function hv(t){return t.replace(/\[([^\]]+)\]/g,'<span class="var">[$1]</span>')}
        function gl(p){return{ti:p['t'+({fr:'f',en:'e',sp:'sp',ar:'a'}[L])]||p.tf,pr:p['p'+({fr:'f',en:'e',sp:'sp',ar:'a'}[L])]||p.pf,ex:p['e'+({fr:'f',en:'e',sp:'sp',ar:'a'}[L])]||p.ef,xp:p['x'+({fr:'f',en:'e',sp:'sp',ar:'a'}[L])]||p.xf}}
        function render(){
            const d=I[L],pp=I[L]['p'+PG];
            document.getElementById('heroBadge').textContent=d.hb;
            document.getElementById('heroTitle').innerHTML=pp.ht;
            document.getElementById('heroSub').textContent=pp.hs;
            document.getElementById('statP').textContent=d.sp;
            document.getElementById('statL').textContent=d.sl;
            document.getElementById('si').placeholder=d.ph;
            const start=(PG-1)*10,end=PG*10,pagePrompts=D.slice(start,end);
            let h='';const fp=S?pagePrompts.filter(p=>{const l=gl(p);return l.ti.toLowerCase().includes(S)||l.pr.toLowerCase().includes(S)}):pagePrompts;
            if(!fp.length){h=`<div class="empty">${d.em}</div>`}else if(PG===1){
                h+=`<div class="cat-section"><div class="cat-range">${fp.length} prompts</div>`;
                for(const p of fp){const l=gl(p);const st=esc(l.pr).replace(/'/g,"\\'");
                    h+=`<div class="prompt-card"><div class="prompt-num">#${p.n}</div><div class="prompt-title">${esc(l.ti)}</div><div class="prompt-txt">${hv(l.pr)}</div><button class="btn-copy" onclick="event.stopPropagation();copyT(this,'${st}')">${d.cp}</button><div class="prompt-actions"><button class="btn-detail" onclick="openM(${p.n})">${d.dt}</button></div></div>`;}
                h+=`</div>`;
            }else{
                const cats=PG===2?[pp.c1,pp.c2]:[pp.c1,pp.c2];
                const splits=PG===2?[4,6]:[5,5];
                let idx=0;
                cats.forEach((ct,i)=>{
                    const items=fp.filter(p=>{const pi=pagePrompts.indexOf(p);return pi>=idx&&pi<idx+splits[i]});
                    const realIdx=idx;idx+=splits[i];
                    const fp2=S?items:items;
                    if(!fp2.length)return;
                    h+=`<div class="cat-section"><div class="cat-title">${ct}</div><div class="cat-range">${fp2.length} prompts</div>`;
                    for(const p of fp2){const l=gl(p);const st=esc(l.pr).replace(/'/g,"\\'");
                        h+=`<div class="prompt-card"><div class="prompt-num">#${p.n}</div><div class="prompt-title">${esc(l.ti)}</div><div class="prompt-txt">${hv(l.pr)}</div><button class="btn-copy" onclick="event.stopPropagation();copyT(this,'${st}')">${d.cp}</button><div class="prompt-actions"><button class="btn-detail" onclick="openM(${p.n})">${d.dt}</button></div></div>`;}
                    h+=`</div>`;
                });
            }
            document.getElementById('mc').innerHTML=h;
            document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===L));
            document.querySelectorAll('.page-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.pg)===PG));
            document.getElementById('statCount').textContent=S?fp.length:'30';
            if(L==='ar'){document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar')}else{document.documentElement.removeAttribute('dir');document.documentElement.setAttribute('lang',L==='sp'?'es':L)}
        }
        function filter(){S=document.getElementById('si').value.toLowerCase().trim();render()}
        function switchPage(p){PG=p;document.getElementById('si').value='';S='';filter();render();window.scrollTo({top:0,behavior:'smooth'})}
        function openM(n){CP=D.find(p=>p.n===n);if(!CP)return;const d=I[L],l=gl(CP);document.getElementById('mt').textContent=l.ti;document.getElementById('mel').textContent=d.el;document.getElementById('me').textContent=l.ex;document.getElementById('mxl').textContent=d.xl;document.getElementById('mx').innerHTML=l.xp;document.getElementById('mo').classList.add('active');document.body.classList.add('modal-open')}
        function closeM(e){if(e&&e.target!==document.getElementById('mo'))return;document.getElementById('mo').classList.remove('active');document.body.classList.remove('modal-open');CP=null}
        function copyT(b,t){const c=t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\\'/g,"'").replace(/<[^>]+>/g,'');navigator.clipboard.writeText(c).then(()=>{b.textContent=I[L].cd;setTimeout(()=>{b.textContent=I[L].cp},2000)})}
        function switchL(l){L=l;localStorage.setItem('bestOfL',l);render()}
        function toggleT(){T=T==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',T);const b=document.querySelector('.theme-btn');b.textContent=T==='light'?'🌙':'☀️';localStorage.setItem('bestOfT',T)}
        function init(){
            T=localStorage.getItem('bestOfT')||'light';document.documentElement.setAttribute('data-theme',T);
            L=localStorage.getItem('bestOfL')||'fr';
            const hc=document.getElementById('hc');
            [{c:'fr',f:'🇫🇷',l:'FR'},{c:'en',f:'🇬🇧',l:'EN'},{c:'sp',f:'🇪🇸',l:'ES'},{c:'ar',f:'🇲🇦',l:'AR'}].forEach(x=>{const b=document.createElement('button');b.className='lang-btn';b.dataset.lang=x.c;b.innerHTML=`<span>${x.f}</span> ${x.l}`;b.onclick=()=>switchL(x.c);hc.appendChild(b)});
            const tb=document.createElement('button');tb.className='theme-btn';tb.textContent=T==='light'?'🌙':'☀️';tb.onclick=toggleT;hc.appendChild(tb);
            const pn=document.getElementById('pn');
            for(let i=1;i<=3;i++){const b=document.createElement('button');b.className='page-btn';b.dataset.pg=i;b.textContent=((i-1)*10+1)+'–'+(i*10);b.onclick=()=>switchPage(i);pn.appendChild(b)}
            render();
            document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('mo').classList.contains('active'))closeM()});
        }
        document.addEventListener('DOMContentLoaded',init);
    </script>
